name: Build CareerOS Website (Windows)
on:
  workflow_dispatch:
  push:
    paths: ["CareerOS/**"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CareerOS/CareerOS.csproj
      - run: dotnet build CareerOS/CareerOS.csproj -c Release --no-restore
      - run: dotnet publish CareerOS/CareerOS.csproj -c Release -r win-x64 --self-contained true -o CareerOS/bin/publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CareerOSWebsite-win-x64
          path: CareerOS/bin/publish/win-x64
